name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test & build (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Show toolchain
        run: node -v && npm -v

      # Electron's binary download is skipped on purpose: CI never opens a window.
      - name: Install root dependencies
        run: npm ci --ignore-scripts
        continue-on-error: true

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Build first: the backend bundle and the web UI are shipped artifacts and one
      # supervisor test asserts that the built UI is served.
      - name: Build backend bundle
        run: node scripts/build-backend.mjs

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Backend tests
        shell: bash
        working-directory: backend
        # Test files run one at a time: several of them spawn real servers and child
        # processes, and a 2-core CI runner has no headroom for 13 of those in parallel.
        # TAP output is kept so a red build reports *which* test failed and why.
        run: |
          set +e
          : > tap.log
          failed=0
          for file in $(ls test/*.test.mjs); do
            node --test --test-reporter=tap "$file" >> tap.log 2>&1 || failed=1
          done
          if [ $failed -ne 0 ]; then
            names=$(grep -E "^not ok" tap.log | head -12 | tr '\n' '|' | tr -d '\r')
            echo "::error title=BACKEND TESTS FAILED::${names}"
            details=$(grep -E "^[[:space:]]+(error|location|code|expected|actual|operator):" tap.log | head -40 | tr '\n' '|' | tr -d '\r')
            echo "::error title=TAP ERROR DETAILS::$(printf '%.3500s' "$details")"
            echo "──── last 25 lines ────"
            tail -25 tap.log
          else
            grep -E "^# (tests|pass|fail|skipped)" tap.log || true
          fi
          exit $failed

      - name: Verify build artifacts
        shell: bash
        run: |
          test -f backend/dist/server.mjs
          test -f backend/dist/skills/builtin/code-review.md
          test -f frontend/dist/index.html

      - name: Live smoke test (real HTTP + SSE + MCP + plugins)
        run: node scripts/smoke.mjs

  lint-syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every backend module
        shell: bash
        run: |
          for file in $(find backend/src backend/examples backend/test scripts -name "*.mjs" -o -name "*.js"); do
            node --check "$file"
          done
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/supervisor.cjs
