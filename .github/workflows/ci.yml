name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test & build (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Show toolchain
        run: node -v && npm -v

      # Electron's binary download is skipped on purpose: CI never opens a window.
      - name: Install root dependencies
        run: npm ci --ignore-scripts
        continue-on-error: true

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Build first: the backend bundle and the web UI are shipped artifacts and one
      # supervisor test asserts that the built UI is served.
      - name: Build backend bundle
        run: node scripts/build-backend.mjs

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Backend tests
        shell: bash
        working-directory: backend
        # The glob is expanded by bash (not node) so this works on Node 20 and 22 alike.
        run: node --test $(ls test/*.test.mjs)

      - name: Verify build artifacts
        shell: bash
        run: |
          test -f backend/dist/server.mjs
          test -f backend/dist/skills/builtin/code-review.md
          test -f frontend/dist/index.html

      - name: Live smoke test (real HTTP + SSE + MCP + plugins)
        run: node scripts/smoke.mjs

  lint-syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every backend module
        shell: bash
        run: |
          for file in $(find backend/src backend/examples backend/test scripts -name "*.mjs" -o -name "*.js"); do
            node --check "$file"
          done
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/supervisor.cjs
